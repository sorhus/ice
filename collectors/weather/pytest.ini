[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categories
markers =
    integration: tests that require real API access (deselect with '-m "not integration"')

# Default options (skip integration tests by default, run with: pytest -m integration)
addopts = -v --tb=short -m "not integration"

# Ignore deprecation warnings from third-party packages
filterwarnings =
    ignore::DeprecationWarning
